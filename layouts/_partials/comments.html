{{- if and (eq .Section "posts") .TranslationKey }}
<div id="utterances-comments"></div>
<script>
  (() => {
    const theme = () => document.documentElement.dataset.theme === "dark"
      ? "github-dark"
      : "github-light";

    const script = document.createElement("script");
    script.src = "https://utteranc.es/client.js";
    script.setAttribute("repo", "SpaceShaman/spaceshaman.github.io");
    script.setAttribute("issue-term", "article:{{ .TranslationKey }}");
    script.setAttribute("theme", theme());
    script.crossOrigin = "anonymous";
    script.async = true;
    document.getElementById("utterances-comments").appendChild(script);

    new MutationObserver(() => {
      document.querySelector(".utterances-frame")?.contentWindow.postMessage(
        { type: "set-theme", theme: theme() },
        "https://utteranc.es"
      );
    }).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"]
    });
  })();
</script>
{{- end }}
